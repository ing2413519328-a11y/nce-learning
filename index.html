<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新概念英语第一册学习系统</title>
    <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 新概念英语第一册</h1>
            <div class="lesson-progress">
                <span id="currentLessonDisplay">Lesson 1</span>
                <span id="progressText">0/3 完成</span>
            </div>
            <div style="display:flex; gap:10px; justify-content:center; margin-top:15px;">
                <button class="btn-lesson-select" id="btnLessonSelect">📋 选择课程</button>
                <button class="btn-lesson-select" onclick="showMistakeBook()">📖 错题本</button>
            </div>
        </header>

        <div id="stageNav" class="stage-nav">
            <!-- 阶段切换标签 -->
        </div>

        <div id="app">
            <!-- 动态内容 -->
        </div>
    </div>

    <!-- 课程选择弹窗 -->
    <div id="lessonSelectorModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📋 选择课程</h2>
                <button class="modal-close" id="btnModalClose">✕</button>
            </div>
            <div class="modal-body" id="lessonList">
                <!-- 动态生成课程列表 -->
            </div>
        </div>
    </div>

    <script src="lessons.js?v=2"></script>
    <script src="review.js?v=2"></script>
    <script src="app.js?v=2"></script>
    <script>
        // 检查是否需要复习或测试
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const currentLessonNum = userProgress.currentLesson + 1;

                // 每10课进行综合测试
                if (currentLessonNum % 10 === 0 && !userProgress.lessons[userProgress.currentLesson].vocabulary) {
                    loadStage('milestone-test');
                }
                // 检查是否有需要复习的内容
                else if (hasReviewItems() && !userProgress.lessons[userProgress.currentLesson].vocabulary) {
                    showReviewPrompt();
                }
            }, 100);
        });
    </script>
</body>
</html>
