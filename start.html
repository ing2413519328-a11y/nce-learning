<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新概念英语 - 启动</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
        }
        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 40px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 1.2em;
            margin: 10px;
            transition: transform 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .info {
            margin-top: 30px;
            padding: 20px;
            background: #f0f9ff;
            border-radius: 10px;
            color: #1e293b;
            line-height: 1.8;
        }
        .step {
            text-align: left;
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 新概念英语学习系统</h1>
        <p>点击下面的按钮开始学习</p>

        <a href="index.html" class="btn">🚀 开始学习</a>

        <div class="info">
            <h3>💡 使用提示</h3>
            <div class="step">
                <strong>1. 添加到主屏幕：</strong><br>
                点击底部"分享"按钮 → 添加到主屏幕
            </div>
            <div class="step">
                <strong>2. 允许麦克风：</strong><br>
                口语训练需要麦克风权限
            </div>
            <div class="step">
                <strong>3. 使用Safari：</strong><br>
                确保用Safari浏览器打开
            </div>
        </div>
    </div>
</body>
</html>
